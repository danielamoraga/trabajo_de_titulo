[project]
name = "uparticipa-ucampus-mock"
version = "0.1.0"
description = "Mock del backend de UParticipa como Servicio Externo de UCampus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
