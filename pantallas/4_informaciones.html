<!--
  UPARTICIPA — Informaciones de la votación
  Mockup funcional autocontenido del Servicio Externo de UParticipa.

  Reúne cuatro vistas de una elección: urna electrónica, estadísticas,
  resultados y verificación. Cuáles se ofrecen depende de si la elección
  está en curso o terminada.

  CÓMO ABRIRLO
    python3 -m http.server 8000
    http://localhost:8000/4_informaciones.html

  No necesita backend ni instalación: el JavaScript va embebido y los
  datos están simulados en el propio archivo. El estado del flujo
  (papeleta pendiente y votos emitidos) se guarda en sessionStorage. Si
  el archivo se abre con doble clic (file://) y el navegador bloquea
  sessionStorage, se usa window.name, que se mantiene mientras se navega
  en la misma pestaña. Conviene usar el servidor.

  Para volver a probar desde cero sin cerrar la pestaña, ejecutar
  reiniciarMock() en la consola del navegador.

  LAS CUATRO PANTALLAS
    1_listado.html        elecciones habilitadas
    2_cabina.html         papeleta
    3_encriptado.html     encriptado, confirmación y emisión
    4_informaciones.html  urna, estadísticas, resultados y verificación

  Se enlazan entre sí, así que el flujo completo se recorre desde el
  listado. Tienen que estar en la misma carpeta, junto a media/, y con
  estos nombres: si se renombran, los enlaces dejan de funcionar.

  PARÁMETROS DE URL
    ?theme=focus | focus-dark | classic | classic-dark   (por defecto focus)
    ?chrome=0   muestra solo lo que produce el Servicio Externo
    ?v=34708    versión de la hoja de estilos de UCampus
    ?css=URL    hoja de estilos a usar en lugar de la de UCampus

  Los enlaces entre pantallas conservan theme, chrome y v.

  ALCANCE
  El header, el menú lateral y el footer institucional los renderiza
  UCampus fuera del iframe; aquí están simulados solo para dar contexto.
  Con ?chrome=0 desaparecen, y lo que queda es lo que le corresponde al
  Servicio Externo, incluido su propio pie con los logos de CLCERT y
  UParticipa (enlazados a clcert.cl y uparticipa.cl).

  ESTILOS
  Los componentes usan la hoja de estilos institucional de UCampus, que
  se carga en tiempo de ejecución según el tema. En producción su URL
  viene en el campo "css" del ticket. No hay estilos propios, salvo unos
  pocos en línea en el pie: separación superior, alineación vertical de
  los logos y espacio entre ellos. El centrado usa la clase .center de
  UCampus.
-->

    for (let i = 0; i < 43; i++) {

      x >>>= 0;

      x ^= x << 5;

    return "?" + q.toString();
  }
  function montar({ migas = [] } = {}) {
    const conChrome = params2.get("chrome") !== "0";
    let tema = params2.get("theme");
    if (!TEMAS.includes(tema)) tema = "focus";
    const version = params2.get("v") || "34708";
    const css = params2.get("css") || `https://ucampus.uchile.cl/d/css/${tema}.style_v${version}.css`;
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.media = "all";
    link.href = css;
    document.head.appendChild(link);
    const resizer = document.createElement("script");
    resizer.src = "https://ucampus.uchile.cl/b/externos/resizer.js";
    document.head.appendChild(resizer);
    const navbar = migas.map(
      (m) => m.href ? `<li><a href="${m.href}">${m.texto}</a></li>` : `<li>${m.texto}</li>`
    ).join("");
    if (!conChrome) {
      document.body.innerHTML = `<div id="mensajes" role="status"></div><div id="body" role="main" class="fcfm uparticipa ${tema}"></div>`;
      return document.getElementById("body");
    }
    document.documentElement.className = "js no-touch cssanimations csstransforms csstransitions fontface generatedcontent svg inlinesvg";
    document.body.className = "logeado";
    document.body.dataset.dev = "logeado";
    document.body.innerHTML = ARRIBA + `<ul id="navbar">${navbar}</ul><div id="mensajes" role="status"></div><div id="body" role="main" class="fcfm uparticipa ${tema}"></div>` + ABAJO;
    document.querySelectorAll("#footer .themes li").forEach((li) => {
      const t = li.dataset.theme;
      li.classList.toggle("sel", t === tema);
      const a = li.querySelector("a");
      if (a && t) a.href = urlCon({ theme: t });
    });
    document.querySelectorAll("#menu .toggle").forEach((a) => {
      a.addEventListener("click", (ev) => {
        ev.preventDefault();
        document.getElementById(a.dataset.bloque)?.classList.toggle("active");
      });
    });
    document.querySelectorAll("#footer .conf > a").forEach((a) => {
      a.addEventListener("click", (ev) => {
        ev.preventDefault();
        a.parentNode.classList.toggle("active");
      });
    });
    document.getElementById("toggler")?.addEventListener("click", (ev) => {
      ev.preventDefault();
      ["toggler", "menu", "navigation-wrapper", "navigation"].forEach((id) => {
        document.getElementById(id)?.classList.toggle("active");
      });
    });
    return document.getElementById("body");
  }
  function enlazarModulo(href) {
    document.querySelectorAll("#favs li.uparticipa a, #servicios li#uparticipa a").forEach((a) => {
      a.href = href;
    });
  }

  // ── Componentes de interfaz compartidos: avisos, botones, barras y pie ──
  function esc(valor) {
    return String(valor).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
    );
  }
  function numero(n) {
    return Number(n).toLocaleString("es-CL");
  }
  var AVISO = {
    neutro: "maviso",
    exito: "mexito",
    error: "merror",
    info: "minfo"
  };
  function aviso(texto, tipo = AVISO.neutro) {
    const mensajes = document.getElementById("mensajes");
    if (!mensajes) return;
    mensajes.classList.add("js");
    let caja = document.getElementById(tipo);
    if (!caja) {
      caja = document.createElement("div");
      caja.id = tipo;
      caja.innerHTML = '<a class="close" href="#">x</a><ul></ul>';
      caja.addEventListener("click", () => caja.remove());
      mensajes.appendChild(caja);
    }
    const li = document.createElement("li");
    li.textContent = texto;
    caja.querySelector("ul").appendChild(li);
  }
  var ETIQUETA_ESTADO = {
    en_curso: "Abierta",
    finalizada: "Finalizada",
    en_pausa: "En pausa"
  };
  function pillEstado(estado) {
    const clase = estado === "en_curso" ? "pill ok" : "pill ";
    return `<div class="${clase}">${ETIQUETA_ESTADO[estado] || esc(estado)}</div>`;
  }
  function objeto(eleccion) {
    return `
<div class="objeto">
  <h1>${esc(eleccion.nombre)} ${pillEstado(eleccion.estado)}</h1>
  <h2>Desde el ${esc(eleccion.desde)} hasta el ${esc(eleccion.hasta)}</h2>
</div>`;
  }
  function pestanas(clase, items) {
    const lis = items.map((i) => {
      const sel = i.activa ? ' class="sel"' : "";
      return `<li${sel}><a href="${i.href || "#"}">${esc(i.etiqueta)}</a></li>`;
    }).join("");
    return `<ul class="${clase}">${lis}</ul>`;
  }
  var submodulo = (items) => pestanas("submodulo", items);
  function espera(texto = "Cargando...") {
    return `<div class="espera">${esc(texto)}</div>`;
  }
  function datosResponsive(filas) {
    const cuerpo = filas.map(
      (f) => `<div class="responsive-row "><span class="responsive-label">${esc(f.etiqueta)}</span> ${f.valor}</div>`
    ).join("");
    return `<div class="responsive-data only-movil no-print">${cuerpo}</div>`;
  }
  function boton(texto, href, { variante = "", activo = true } = {}) {
    const clase = `boton${variante ? " " + variante : ""}`;
    return activo ? `<a class="${clase}" href="${href}">${esc(texto)}</a>` : `<span class="${clase}" aria-disabled="true">${esc(texto)}</span>`;
  }
  function claseFilaUrna(papeleta, miPapeleta, indice) {
    if (miPapeleta && papeleta === miPapeleta) return "warn";
    return indice % 2 ? "even" : "odd";
  }
  function pie() {
    return `<p class="center" style="margin-top: 4em"><a href="https://clcert.cl/" target="_blank" rel="noreferrer"><img src="media/logo_clcert.png" alt="CLCERT" height="48" style="vertical-align: middle"></a> <a href="https://uparticipa.cl/" target="_blank" rel="noreferrer" style="margin-left: 1.5em"><img src="media/logo_uparticipa.png" alt="UParticipa" height="32" style="vertical-align: middle"></a></p>`;
  }

  // ── Pantalla: informaciones de la votación ──
  var raiz = montar({
    migas: [{ texto: "UParticipa", href: enlace("1_listado.html") }, { texto: "\u2026" }]
  });
  enlazarModulo(enlace("1_listado.html"));
  var params3 = new URLSearchParams(location.search);
  var POR_PAGINA = 50;
  var VISTAS = [
    { id: "resultados", etiqueta: "Resultados" },
    { id: "urna", etiqueta: "Urna electr\xF3nica" },
    { id: "estadisticas", etiqueta: "Estad\xEDsticas" },
    { id: "verificacion", etiqueta: "Verificaci\xF3n" }
  ];
  function vistaActual() {
    const v = params3.get("vista");
    return VISTAS.some((x) => x.id === v) ? v : "urna";
  }
  function tablaUrna(pagina, miPapeleta) {
    const filas = pagina.filas.map(
      (f, i) => `
<tr class="${claseFilaUrna(f.papeleta, miPapeleta, i)}">
  <td class="string responsive-main">${esc(f.papeleta)}
    ${datosResponsive([
        { etiqueta: "Voto Encriptado", valor: '<a href="#">Descargar</a>' }
      ])}
  </td>
  <td class="center">${boton("Descargar", "#")}</td>
</tr>`
    ).join("");
    const tabla = `
<table class="detalle">
<colgroup>
  <col class="col0 string responsive-main">
  <col class="col1 center">
</colgroup>
<thead class="sticky">
<tr class="even">
  <th class="string responsive-main">C\xF3digo de Papeleta</th>
  <th class="center">Voto Encriptado</th>
</tr>
</thead>
<tbody>${filas}</tbody>
</table>`;
    const nav = `<p>` + boton("Previo", enlaceAqui({ pagina: pagina.pagina - 1 }), {
      activo: pagina.pagina > 1
    }) + " " + boton("Siguiente", enlaceAqui({ pagina: pagina.pagina + 1 }), {
      activo: pagina.pagina < pagina.total_paginas
    }) + `</p><p>P\xE1gina ${pagina.pagina} de ${pagina.total_paginas} (Mostrando ${pagina.desde}-${pagina.hasta} de ${numero(pagina.total)} resultados)</p>`;
    return tabla + nav;
  }
  async function renderUrna(eleccion, destino) {
    destino.innerHTML = espera("Cargando urna...");
    let p = parseInt(params3.get("pagina"), 10);
    if (!p || p < 1) p = 1;
    try {
      const pagina = await api.urna(eleccion.id, { pagina: p, porPagina: POR_PAGINA });
      if (!pagina.total) {
        destino.innerHTML = `<p>La urna a\xFAn no registra votos.</p>`;
        return;
      }
      destino.innerHTML = tablaUrna(pagina, eleccion.mi_papeleta);
      if (eleccion.mi_papeleta) {
        aviso(
          "Su papeleta aparece destacada en la urna. Ese c\xF3digo le permite verificar que su voto fue registrado.",
          AVISO.info
        );
      }
    } catch (e) {
      destino.innerHTML = "";
      aviso(
        e instanceof ErrorApi ? e.message : "Ocurri\xF3 un error inesperado.",
        AVISO.error
      );
    }
  }
  async function main() {
    if (!idEleccion) {
      aviso("No se indic\xF3 qu\xE9 elecci\xF3n abrir.", AVISO.error);
      return;
    }
    raiz.innerHTML = espera();
    let eleccion;
    try {
      eleccion = await api.eleccion(idEleccion);
    } catch (e) {
      raiz.innerHTML = "";
      aviso(
        e instanceof ErrorApi ? e.message : "Ocurri\xF3 un error inesperado.",
        AVISO.error
      );
      return;
    }
    document.querySelector("#navbar li:last-child").textContent = eleccion.nombre;
    const actual = vistaActual();
    const subs = submodulo(
      VISTAS.map((v) => ({
        etiqueta: v.etiqueta,
        // Cambiar de vista reinicia la paginación.
        href: enlaceAqui({ vista: v.id, pagina: null }),
        activa: v.id === actual
      }))
    );
    raiz.innerHTML = objeto(eleccion) + subs + `<div id="vista"></div>` + pie();
    const destino = document.getElementById("vista");
    if (actual === "urna") {
      await renderUrna(eleccion, destino);
      return;
    }
    destino.innerHTML = `<p>Pantalla pendiente de implementaci\xF3n.</p>`;
  }
  main();
})();

</script>
</body>
</html>
